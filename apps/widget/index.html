<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mizuki Flora — booking widget (development)</title>
    <!--
      A stand-in for the WordPress page. It mounts the widget through exactly the same
      data attributes the [mizuki_booking] shortcode renders, so what you see here is what
      a student sees on mizuki.com.sg. Development only — the production build is a library
      bundle and never includes this file.
    -->
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        background: #faf7f8;
        color: #2f292f;
      }
      .page { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
      .site-head {
        border-bottom: 1px solid #e7e0e4;
        padding-bottom: 18px;
        margin-bottom: 28px;
      }
      .site-head h1 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6b5b73;
      }
      .site-head p { margin: 6px 0 0; color: #7b7178; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="site-head">
        <h1>Mizuki Flora</h1>
        <p>Development preview — this stands in for the WordPress page.</p>
      </div>

      <!--
        Exactly what [mizuki_booking] outputs: one mount, view "all", and the widget draws its
        own tabs.

        This page used to mount the two views separately behind hand-written tabs, which looked
        the same and behaved differently — the widget's own tabs read ?tab=bookings from the
        address, and hand-written ones do not. Every confirmation email links to
        /book-a-class/?tab=bookings, so the one thing most worth testing locally was the one
        thing this page could not test.
      -->
      <div data-mizuki-booking data-api-base="http://localhost:4000" data-view="all"></div>

      <!--
        The IFDA student page, on the same harness so both can be looked at side by side.
        Matches [mizuki_course_portal course="ifda"] exactly.
      -->
      <hr style="margin: 48px 0 32px; border: 0; border-top: 1px solid #e7e0e4" />
      <p style="color: #7b7178; font-size: 14px; margin-bottom: 16px">
        Below: <code>[mizuki_course_portal course="ifda"]</code>
      </p>
      <div data-mizuki-booking data-api-base="http://localhost:4000" data-view="course-portal" data-course="ifda"></div>
    </div>

    <script type="module" src="/src/embed.tsx"></script>
  </body>
</html>
